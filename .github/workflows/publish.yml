name: Publish Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      packages: write

    steps:
      - uses: "actions/checkout@v6"
      - uses: "docker/setup-buildx-action@v4"
      - uses: "docker/login-action@v4"
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: "docker/metadata-action@v5"
        id: "meta"
        with:
          images: "ghcr.io/kithlo-server/worker"
          tags: "type=semver,pattern={{version}}\ntype=semver,pattern={{major}}.{{minor}}\ntype=ref,event=branch\ntype=raw,value=latest,enable={{is_default_branch}}"
      - uses: "docker/build-push-action@v6"
        with:
          context: "."
          file: "./Dockerfile"
          platforms: "linux/amd64,linux/arm64"
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: "type=registry,ref=ghcr.io/kithlo-server/worker:latest"
          cache-to: "type=inline"
